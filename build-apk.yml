name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal
    paths-ignore:
      - 'README.md'
      - '*.md'
      - '*.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validar assinatura persistente
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_KEYSTORE_BASE64}" || { echo "ERRO: secret ANDROID_KEYSTORE_BASE64 ausente."; exit 1; }
          test -n "${ANDROID_KEYSTORE_PASSWORD}" || { echo "ERRO: secret ANDROID_KEYSTORE_PASSWORD ausente."; exit 1; }
          test -n "${ANDROID_KEY_ALIAS}" || { echo "ERRO: secret ANDROID_KEY_ALIAS ausente."; exit 1; }
          test -n "${ANDROID_KEY_PASSWORD}" || { echo "ERRO: secret ANDROID_KEY_PASSWORD ausente."; exit 1; }
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/oasis-autoplay-release.jks"
          keytool -list -keystore "${RUNNER_TEMP}/oasis-autoplay-release.jks" -storepass "${ANDROID_KEYSTORE_PASSWORD}" -alias "${ANDROID_KEY_ALIAS}" >/dev/null
          echo "Assinatura persistente validada."

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/oasisautoplay app/src/main/res/values app/src/main/res/xml app/src/main/assets

          # Copia todas as classes Java da raiz. Isso evita ter de alterar
          # o workflow cada vez que o motor ganhar um helper novo.
          shopt -s nullglob
          ROOT_JAVA=( *.java )
          test ${#ROOT_JAVA[@]} -gt 0 || { echo "ERRO: nenhum .java na raiz."; exit 1; }
          cp -v "${ROOT_JAVA[@]}" app/src/main/java/com/oasisautoplay/

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp strings.xml app/src/main/res/values/strings.xml
          cp accessibility_service_config.xml app/src/main/res/xml/accessibility_service_config.xml

          ROOT_ASSETS=( *.png )
          test ${#ROOT_ASSETS[@]} -gt 0 || { echo "ERRO: nenhuma imagem PNG encontrada na raiz."; exit 1; }
          cp -v "${ROOT_ASSETS[@]}" app/src/main/assets/

          cat > settings.gradle <<'GRADLE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "OasisAutoplay"
          include(":app")
          GRADLE

          cat > build.gradle <<'GRADLE'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          GRADLE

          cat > gradle.properties <<'GRADLE'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          GRADLE

          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.oasisautoplay'
              compileSdk 34
              defaultConfig {
                  applicationId "com.oasisautoplay"
                  minSdk 24
                  targetSdk 34
                  versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
                  versionName "build-" + System.getenv("GITHUB_RUN_NUMBER")
              }
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/oasis-autoplay-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1' }
          GRADLE

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace

      - name: Verificar assinatura
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "${APK}" || { echo "ERRO: APK nao foi gerado."; exit 1; }
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "${APK}"

      - name: Renomear APK
        shell: bash
        run: cp app/build/outputs/apk/release/app-release.apk "Oasis-Autoplay-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Oasis-Autoplay-build-${{ github.run_number }}
          path: Oasis-Autoplay-build-${{ github.run_number }}.apk
          retention-days: 30
