name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal
    paths-ignore:
      - 'README.md'
      - '*.md'
      - '*.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android 34
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validar assinatura persistente
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ANDROID_KEYSTORE_BASE64}" || {
            echo "ERRO: secret ANDROID_KEYSTORE_BASE64 ausente."
            exit 1
          }

          test -n "${ANDROID_KEYSTORE_PASSWORD}" || {
            echo "ERRO: secret ANDROID_KEYSTORE_PASSWORD ausente."
            exit 1
          }

          test -n "${ANDROID_KEY_ALIAS}" || {
            echo "ERRO: secret ANDROID_KEY_ALIAS ausente."
            exit 1
          }

          test -n "${ANDROID_KEY_PASSWORD}" || {
            echo "ERRO: secret ANDROID_KEY_PASSWORD ausente."
            exit 1
          }

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode \
            > "${RUNNER_TEMP}/oasis-autoplay-release.jks"

          keytool -list \
            -keystore "${RUNNER_TEMP}/oasis-autoplay-release.jks" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${ANDROID_KEY_ALIAS}" \
            >/dev/null

          echo "Assinatura persistente validada."

      - name: Preparar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/oasisautoplay
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          cp MainActivity.java \
            app/src/main/java/com/oasisautoplay/MainActivity.java

          cp OasisAccessibilityService.java \
            app/src/main/java/com/oasisautoplay/OasisAccessibilityService.java

          cp AndroidManifest.xml \
            app/src/main/AndroidManifest.xml

          cp strings.xml \
            app/src/main/res/values/strings.xml

          cp accessibility_service_config.xml \
            app/src/main/res/xml/accessibility_service_config.xml

          shopt -s nullglob
          ROOT_ASSETS=( *.png )

          if [ ${#ROOT_ASSETS[@]} -eq 0 ]; then
            echo "ERRO: nenhuma imagem PNG encontrada na raiz."
            exit 1
          fi

          echo "Imagens encontradas: ${#ROOT_ASSETS[@]}"

          cp -v "${ROOT_ASSETS[@]}" \
            app/src/main/assets/

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "OasisAutoplay"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.oasisautoplay'
              compileSdk 34

              defaultConfig {
                  applicationId "com.oasisautoplay"
                  minSdk 24
                  targetSdk 34

                  versionCode Integer.parseInt(
                      System.getenv("GITHUB_RUN_NUMBER")
                  )

                  versionName "build-" +
                      System.getenv("GITHUB_RUN_NUMBER")
              }

              signingConfigs {
                  release {
                      storeFile file(
                          System.getenv("RUNNER_TEMP") +
                          "/oasis-autoplay-release.jks"
                      )

                      storePassword System.getenv(
                          "ANDROID_KEYSTORE_PASSWORD"
                      )

                      keyAlias System.getenv(
                          "ANDROID_KEY_ALIAS"
                      )

                      keyPassword System.getenv(
                          "ANDROID_KEY_PASSWORD"
                      )
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.google.mlkit:text-recognition:16.0.1'
          }
          EOF

      - name: Corrigir motor visual e combate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/oasisautoplay/OasisAccessibilityService.java')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'PATCH FALHOU: bloco não encontrado: {label}')
              s = s.replace(old, new, 1)
              print('PATCH OK:', label)

          replace_once(
          '''        // Fluxo de combate estrito: enquanto uma tela específica é esperada,
          // nenhuma rotina paralela pode começar a clicar em outros controles.
          if (combatContext
                  && expectedVisualScene != VisualScene.UNKNOWN
                  && !isCompatibleFlowScene(expectedVisualScene, visualScene)) {

              long elapsed = now - flowStepSinceMs;

              if (elapsed < FLOW_STEP_WAIT_MS) {
                  nextAllowedAnalysisMs = now + 250;
                  return;
              }

              flowFailureCount++;
              saveFlowFailures(flowFailureCount);

              if (flowFailureCount >= FLOW_MAX_RETRIES) {
                  setVisibleStateOnly(
                          "Combate pausado: esperava " +
                          expectedVisualScene.name() +
                          " / viu " + visualScene.name()
                  );
                  nextAllowedAnalysisMs = now + 1000;
                  return;
              }
          }
          ''',
          '''        // Fluxo orientado pela tela observada. O estado esperado nunca pode
          // aprisionar o motor se a captura real já mudou de tela.
          if (combatContext
                  && expectedVisualScene != VisualScene.UNKNOWN
                  && !isCompatibleFlowScene(expectedVisualScene, visualScene)) {

              long elapsed = now - flowStepSinceMs;
              boolean observedKnownScene = visualScene != VisualScene.UNKNOWN;

              if (!observedKnownScene && elapsed < FLOW_STEP_WAIT_MS) {
                  nextAllowedAnalysisMs = now + 250;
                  return;
              }

              if (elapsed >= FLOW_STEP_WAIT_MS) {
                  flowFailureCount++;
                  saveFlowFailures(flowFailureCount);
                  flowStepSinceMs = now;
              }

              if (observedKnownScene || flowFailureCount >= FLOW_MAX_RETRIES) {
                  VisualScene previousExpected = expectedVisualScene;
                  expectedVisualScene = VisualScene.UNKNOWN;
                  flowFailureCount = 0;
                  saveFlowExpected(expectedVisualScene);
                  saveFlowFailures(0);

                  setVisibleStateOnly(
                          "Ressincronizando: esperava " +
                          previousExpected.name() +
                          " / viu " + visualScene.name()
                  );
              } else {
                  nextAllowedAnalysisMs = now + 300;
                  return;
              }
          }
          ''',
          'ressincronização observacional')

          replace_once(
          '''        if (combatContext && !attackBuffUsed
                  && magicSpellSelected
                  && attackTargetTapped
                  && !detectMagicScreen(b)
                  && !detectSpellTargetMode(b)) {

              // buff aguardando confirmação visual;
              magicSpellSelected = false;
              attackTargetTapped = false;
              magicPhaseSinceMs = 0;
              setState(EngineState.BATTLEFIELD, "Attack confirmado");
              nextAllowedAnalysisMs = now + 500;
          }
          ''',
          '''        if (combatContext && !attackBuffUsed
                  && magicSpellSelected
                  && attackTargetTapped
                  && !detectMagicScreen(b)
                  && !detectSpellTargetMode(b)) {

              attackBuffUsed = true;
              resetMagicScan();
              magicSpellSelected = false;
              attackTargetTapped = false;
              magicPhaseSinceMs = 0;
              expectedVisualScene = VisualScene.UNKNOWN;
              flowFailureCount = 0;
              saveFlowExpected(expectedVisualScene);
              saveFlowFailures(0);
              setState(
                      EngineState.BATTLEFIELD,
                      "Buff Attack confirmado; iniciar ataques"
              );
              nextAllowedAnalysisMs = now + 700;
              return;
          }
          ''',
          'confirmação real do buff')

          replace_once(
          '''                expectFlowScene(
                          VisualScene.BATTLEFIELD_AFTER_ACTION,
                          now
                  );
          ''',
          '''                expectedVisualScene = VisualScene.UNKNOWN;
                  flowFailureCount = 0;
                  saveFlowExpected(expectedVisualScene);
                  saveFlowFailures(0);
          ''',
          'seleção de magia sem expectativa rígida')

          replace_once(
          '''        if (!combatContext
                  && (visualScene == VisualScene.TARGET_MENU
                      || detectTargetMenu(b))) {
          ''',
          '''        if (visualScene == VisualScene.TARGET_MENU
                  || (!combatContext && detectTargetMenu(b))) {
          ''',
          'menu de alvo guiado pela tela')

          replace_once(
          '''        VisualScene routeScene = classifyVisualScene(b);
          if (routeScene != VisualScene.MAP
                  || lastVisualConfidence < 0.58) {

              setRouteStep(
                      "Rota aguardando MAP confiável; " +
                      routeScene.name() + " " +
                      String.format(
                              java.util.Locale.US,
                              "%.2f",
                              lastVisualConfidence
                      )
              );

              nextAllowedAnalysisMs = now + 550;
              return;
          }
          ''',
          '''        VisualScene routeScene = classifyVisualScene(b);

          boolean blockingUi = detectTargetMenu(b)
                  || detectTurnMenu(b)
                  || detectMagicScreen(b)
                  || detectSpellTargetMode(b)
                  || detectVictory(b)
                  || detectReward(b)
                  || findStackCandidates(b).size() >= 2;

          boolean mapAccepted =
                  routeScene == VisualScene.MAP
                  || (routeScene == VisualScene.UNKNOWN && !blockingUi);

          if (!mapAccepted
                  || (routeScene == VisualScene.MAP
                      && lastVisualConfidence < 0.50)) {

              setRouteStep(
                      "Rota aguardando mapa seguro; " +
                      routeScene.name() + " " +
                      String.format(
                              java.util.Locale.US,
                              "%.2f",
                              lastVisualConfidence
                      )
              );

              nextAllowedAnalysisMs = now + 550;
              return;
          }
          ''',
          'rota com fallback seguro para UNKNOWN')

          replace_once(
              '    private static final double TROLL_MATCH_MIN = 0.58;',
              '    private static final double TROLL_MATCH_MIN = 0.52;',
              'limiar Troll com confirmação pelo menu')

          p.write_text(s, encoding='utf-8')

          print(
              'PATCH COMPLETO: motor visual reativo, buff e rota corrigidos'
          )
          PY

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleRelease --stacktrace

      - name: Verificar assinatura
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "${APK}" || {
            echo "ERRO: APK nao foi gerado."
            exit 1
          }

          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            "${APK}"

      - name: Renomear APK
        shell: bash
        run: |
          set -euo pipefail

          cp app/build/outputs/apk/release/app-release.apk \
            "Oasis-Autoplay-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Oasis-Autoplay-build-${{ github.run_number }}
          path: Oasis-Autoplay-build-${{ github.run_number }}.apk
          retention-days: 30
